name: Publish dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
    - cron: '0 7 * * *' # 3 PM Manila
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      FANTASY_DATA_DIR: ${{ github.workspace }}/.feed-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache/restore@v4
        with:
          path: .feed-cache
          key: nba-feed-${{ github.run_id }}
          restore-keys: nba-feed-
      - run: npm test
      - name: Refresh ESPN
        run: node public-feed.mjs
        continue-on-error: true
      - name: Build with latest available cache
        run: node build-pages.mjs
      - uses: actions/cache/save@v4
        with:
          path: .feed-cache
          key: nba-feed-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
